<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch index.html</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B1210;color:#ECEFEC;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:460px;width:100%;background:#101917;border:1px solid #243530;border-radius:14px;padding:28px}
  h1{font-size:1.25rem;margin:0 0 10px}
  p{color:#8FA39B;line-height:1.6;margin:0 0 18px}
  input{width:100%;padding:12px;border:1px dashed #34D399;border-radius:10px;background:#0B1210;color:#ECEFEC;box-sizing:border-box}
  #msg{margin-top:16px;min-height:1.4em}
  .ok{color:#34D399}.err{color:#F87171}
  input:focus-visible{outline:2px solid #34D399;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Add the accounting project images</h1>
  <p>Choose your current <b>index.html</b>. A fixed copy downloads automatically; upload it to GitHub in place of the old one.</p>
  <input type="file" id="f" accept=".html,text/html">
  <div id="msg" aria-live="polite"></div>
</main>
<script>
const NEW_LINES = `image: "images/accounting-system-main.png",
      images: [
        "images/accounting-system-01-journal.png",
        "images/accounting-system-02-slip.png",
        "images/accounting-system-03-ledger.png",
        "images/accounting-system-04-trial-balance.png",
        "images/accounting-system-05-income-statement.png",
        "images/accounting-system-06-balance-sheet.png"
      ],`;
const msg = document.getElementById('msg');
function say(t, cls){ msg.textContent = t; msg.className = cls; }

document.getElementById('f').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const start = text.indexOf('title: "Integrated Accounting System (Excel)"');
  if (start < 0) return say('Could not find the Integrated Accounting System project in this file.', 'err');
  const rest = text.slice(start);
  if (rest.includes('accounting-system-main.png')) return say('This file already has the images.', 'err');
  const m = rest.match(/image:\s*"",/);
  if (!m) return say('Could not find the empty image line for this project.', 'err');
  const at = start + m.index;
  const out = text.slice(0, at) + NEW_LINES + text.slice(at + m[0].length);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type: 'text/html'}));
  a.download = 'index.html';
  a.click();
  say('Done. index.html downloaded.', 'ok');
});
</script>
</body>
</html>
